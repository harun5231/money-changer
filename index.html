<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Changer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--bg:#070b0a;--panel:#101614;--card:#121a17;--line:#26312c;--text:#f4f7f5;--muted:#8e9b95;--green:#19d98b;--green2:#0b9b61;--red:#ff5b69;--blue:#4c9dff;--purple:#a56bff;--orange:#ffad4d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#12372b 0,#070b0a 42%,#050706 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{font-size:14px}
header{padding:13px 14px 9px;background:rgba(7,11,10,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:5}.head{display:flex;align-items:center;justify-content:space-between;max-width:620px;margin:auto}h1{font-size:18px;letter-spacing:.08em;margin:0;font-weight:800}h2,h3{margin:0}.head button{padding:7px 10px;font-size:12px}
main{max-width:620px;margin:auto;padding:10px 10px 20px}.panel,.card{background:linear-gradient(145deg,rgba(20,29,25,.96),rgba(10,16,13,.96));border:1px solid rgba(255,255,255,.075);box-shadow:0 8px 28px rgba(0,0,0,.22);border-radius:15px}.panel{padding:11px;margin-bottom:9px}.card{padding:11px;min-width:0}.label{font-size:9px;line-height:1.15;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.big{font-size:17px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.rate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.money-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.shortcut-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rate-card{position:relative;overflow:hidden}.rate-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}.rate-card.red:before{background:var(--red)}.rate-card.blue:before{background:var(--blue)}.rate-card.purple:before{background:var(--purple)}.rate-card.orange:before{background:var(--orange)}
.rate-card .big.green{color:var(--green)}.rate-card .big.red{color:var(--red)}.rate-card .big.blue{color:var(--blue)}.rate-card .big.purple{color:var(--purple)}.rate-card .big.orange{color:var(--orange)}
.action{border:1px solid rgba(255,255,255,.07);background:#151d19;border-radius:12px;padding:11px 10px;color:#fff;font-weight:750;display:flex;align-items:center;gap:8px;justify-content:center;min-height:45px}.action.primary{background:linear-gradient(135deg,#0c9b62,#08784d);border-color:#18bb78}.action.sell{background:linear-gradient(135deg,#9f2636,#711c29);border-color:#c83b4d}.action .ico{font-size:18px;line-height:1}.share{background:#121a17}.shortcut{min-height:49px;justify-content:flex-start;text-align:left}.shortcut .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#1b2a23}.shortcut .txt{display:flex;flex-direction:column;gap:2px}.shortcut .txt small{font-size:9px;color:var(--muted);font-weight:500}
.refresh{padding:7px 9px!important;font-size:11px!important;border-radius:9px!important;background:#18231e!important}.rate-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title{font-size:11px;color:#d7dfdb;font-weight:800;letter-spacing:.04em;margin-bottom:7px}.thb-card{grid-column:1/-1}.thb-card .big{color:var(--orange)}
button,input{font:inherit}button{padding:10px 12px;border-radius:10px;border:1px solid #33413a;background:#17201c;color:#fff;font-weight:700;cursor:pointer}button.primary{background:#0a8e59;border-color:#0dbd75}button:active{transform:scale(.98)}input{width:100%;padding:11px;border-radius:10px;border:1px solid #33413a;background:#090e0c;color:#fff}.field{margin:10px 0}.field label{display:block;color:#b8c2bd;font-size:12px;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}.status{padding:9px;margin:9px 0;border-radius:10px;background:#0d1411;color:#aeb9b3;font-size:12px}.err{color:#ff9090}.ok{color:#55d99b}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #25302b}th{color:#89958f;font-weight:600}.history-list{display:flex;flex-direction:column}.history-item{padding:11px 0;border-bottom:1px solid #25302b}.history-item:last-child{border-bottom:0}.history-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.history-type{font-weight:750}.history-time{color:#78857f;font-size:10px;white-space:nowrap}.history-details{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.history-detail .label{font-size:8px}.history-value{font-weight:750;margin-top:3px;overflow-wrap:anywhere}.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.share-actions button{min-width:0}
.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end;backdrop-filter:blur(5px)}.modalbox{width:min(620px,100%);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#121a17,#090e0c);border:1px solid #2a3831;border-radius:20px 20px 0 0;padding:15px;box-shadow:0 -12px 40px rgba(0,0,0,.5)}.modalbox .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.modalbox .row>*{flex:initial}.modalbox h2{font-size:17px}.close-btn{padding:7px 10px;font-size:11px}
.login-card{margin-top:35px}.login-card h2{font-size:20px;margin-bottom:12px}.login-card .actions button{min-width:0}
@media(max-width:390px){main{padding:8px}.money-grid{grid-template-columns:repeat(2,1fr)}.big{font-size:16px}.action{font-size:12px}.shortcut{font-size:11px}}

<style>
:root{--bg:#050a0e;--panel:#0b151d;--line:#294153;--text:#f7f9fb;--muted:#a7b6c4;--green:#16e58c;--red:#ff4153;--blue:#1787ff;--purple:#663cff;--orange:#ff9b25}
html,body{background:#050a0e;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{font-size:14px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -12%,rgba(17,70,91,.35),transparent 42%);z-index:-1}
header{padding:14px 22px 11px;background:rgba(5,10,14,.94);border-bottom:1px solid rgba(255,255,255,.05)}.head{max-width:1000px;gap:14px}.brand-mark{display:block;font-size:48px;line-height:.65;color:#10e29a;text-shadow:0 0 18px rgba(16,226,154,.4);font-weight:900}.head-right{margin-left:auto;display:flex;align-items:center;gap:18px}.datebox{text-align:right;color:#dce5ee;font-size:15px;line-height:1.05}.datebox strong{display:block;font-size:23px;color:#fff;margin-top:6px}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#173b67,#10243c);border:1px solid #275487;font-size:20px;font-weight:800}h1{font-size:29px;letter-spacing:.01em}
main{max-width:1000px;padding:10px 22px 24px}.panel,.card{background:linear-gradient(145deg,rgba(12,29,40,.97),rgba(7,16,23,.97));border:1px solid #294253;box-shadow:0 9px 30px rgba(0,0,0,.25);border-radius:16px}.panel{padding:12px}.rate-grid{grid-template-columns:1fr 1fr;gap:10px}.rate-card{min-height:112px;padding:15px}.rate-card.rate-buy,.rate-card.rate-sell{min-height:158px;padding:20px}.rate-card.rate-buy{background:linear-gradient(135deg,rgba(0,103,67,.55),rgba(6,22,25,.96));border-color:#09bd7a}.rate-card.rate-sell{background:linear-gradient(135deg,rgba(113,14,27,.72),rgba(13,17,25,.96));border-color:#d52b40}.rate-card.rate-buy .big,.rate-card.rate-sell .big{font-size:38px}.rate-icon{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;float:left;margin-right:27px;font-size:49px;font-weight:900}.rate-buy .rate-icon{background:rgba(10,221,141,.13);border:1px solid rgba(10,221,141,.5);color:#12e99a}.rate-sell .rate-icon{background:rgba(255,56,75,.14);border:1px solid rgba(255,56,75,.55);color:#ff4356}.subline{font-size:16px;color:#d5dee6;margin-top:5px}.rate-card.small{min-height:112px}.rate-card.small .rate-icon{width:60px;height:60px;font-size:34px;margin-right:15px}.rate-card.small .big{font-size:29px}.rate-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.rate-head .rate-icon{float:none;flex:none}.auto{padding:18px 20px}.refresh{padding:11px 24px!important;font-size:15px!important;border-radius:10px!important;background:#102432!important;border:1px solid #31536b!important;min-width:150px}.thb-card{grid-column:1/-1;max-width:50%;min-height:112px}.thb-card .big{font-size:31px}.thb-icon{background:linear-gradient(#fff 0 20%,#e21d37 20% 37%,#173b7a 37% 63%,#e21d37 63% 80%,#fff 80%);border:2px solid #f04a58}
.money-grid{gap:10px;margin-top:10px}.money-card{padding:17px 18px;min-height:128px}.money-card.purple{border-color:#7140ff;background:linear-gradient(145deg,rgba(71,21,145,.55),rgba(9,24,44,.97))}.money-card.blue{border-color:#1477ff;background:linear-gradient(145deg,rgba(9,71,159,.5),rgba(7,22,39,.97))}.money-card.orange{border-color:#db841e;background:linear-gradient(145deg,rgba(125,71,9,.55),rgba(31,24,12,.97))}.money-card.green{border-color:#10b979;background:linear-gradient(145deg,rgba(0,100,69,.55),rgba(7,27,23,.97))}.money-card .big{font-size:25px}
.action{border-radius:15px;min-height:82px;font-size:20px;padding:15px 18px;background:#172631}.action.primary{background:linear-gradient(135deg,#00a96d,#087b52);border-color:#0cda8c}.action.sell{background:linear-gradient(135deg,#c9273b,#8b1d2d);border-color:#ef4254}.action .ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:31px;background:rgba(255,255,255,.14)}.capital-action{width:100%;margin-top:10px!important;background:linear-gradient(135deg,#075dd0,#0c62da)!important;border-color:#1e7fff!important}.share-actions{gap:10px;margin-top:10px}.share{background:linear-gradient(135deg,#4020b7,#2444bd);border-color:#754dff}.shortcut-grid{grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.shortcut{min-height:164px;justify-content:center;text-align:center;flex-direction:column;gap:12px;font-size:17px;background:linear-gradient(145deg,rgba(11,35,54,.95),rgba(8,22,31,.98));position:relative}.shortcut:nth-child(2){border-color:#168bb5}.shortcut:nth-child(3){border-color:#08a56d;background:linear-gradient(145deg,rgba(0,74,57,.45),rgba(8,27,29,.98))}.shortcut:nth-child(4){border-color:#c97920;background:linear-gradient(145deg,rgba(82,49,15,.45),rgba(27,25,18,.98))}.shortcut .ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(20,117,190,.25);font-size:29px}.shortcut .txt{display:flex;flex-direction:column;gap:4px;align-items:center}.shortcut .txt small{font-size:12px;color:#aebbc4}.shortcut:after{content:"›";position:absolute;right:10px;bottom:13px;font-size:26px;color:#dce7ef}
@media(max-width:700px){header{padding:12px 18px 10px}.brand-mark{font-size:37px}h1{font-size:21px}.head-right{gap:10px}.datebox{font-size:12px}.datebox strong{font-size:19px}.avatar{width:47px;height:47px;font-size:18px}main{padding:7px 18px 18px}.rate-card.rate-buy,.rate-card.rate-sell{min-height:118px;padding:15px}.rate-card.rate-buy .big,.rate-card.rate-sell .big{font-size:28px}.rate-icon{width:58px;height:58px;font-size:34px;margin-right:15px}.subline{font-size:12px}.rate-card.small{min-height:100px;padding:13px}.rate-card.small .big{font-size:22px}.rate-card.small .rate-icon{width:48px;height:48px;font-size:27px;margin-right:12px}.refresh{min-width:0;padding:9px 13px!important;font-size:12px!important}.thb-card{max-width:100%}.money-grid{gap:8px}.money-card{padding:12px;min-height:91px}.money-card .big{font-size:18px}.label{font-size:10px}.action{min-height:64px;font-size:15px;padding:9px}.action .ico{width:44px;height:44px;font-size:24px}.capital-action{min-height:68px}.share-actions{gap:8px}.share-actions .action{font-size:13px}.shortcut-grid{grid-template-columns:repeat(2,1fr);gap:8px}.shortcut{min-height:116px;font-size:13px;padding:10px}.shortcut .ico{width:46px;height:46px;font-size:22px}.shortcut .txt small{font-size:9px}.shortcut:after{right:8px;bottom:8px;font-size:21px}}
@media(max-width:390px){main{padding-left:10px;padding-right:10px}.money-card .big{font-size:16px}.rate-card.rate-buy .big,.rate-card.rate-sell .big{font-size:24px}}
</style></style>

<body>
<header><div class="head"><div class="brand-mark">↔</div><h1>MONEY CHANGER</h1><div class="head-right"><div class="datebox"><span id="todayDate">18 Sep 2026</span><strong id="todayTime">22:11</strong></div><div class="avatar">HN</div><button id="logout" class="hidden">Keluar</button></div></div></header>
<main>
<section id="login" class="panel login-card"><h2>Masuk</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button id="loginBtn" class="primary">Masuk</button><button id="signupBtn">Buat akun</button></div><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden"><div class="rate-grid">
<div class="card rate-card rate-buy"><div class="rate-icon">↗</div><div class="label">KURS BELI USD</div><div id="buyRate" class="big green">Rp0</div><div class="subline">dari customer</div></div>
<div class="card rate-card rate-sell"><div class="rate-icon">↓</div><div class="label">KURS JUAL USD</div><div id="sellRate" class="big red">Rp0</div><div class="subline">ke customer</div></div>
<div class="card rate-card small"><div class="rate-icon base-icon">↻</div><div class="label">KURS DASAR</div><div id="basis" class="big blue">Rp0</div><div class="subline">per 1 USD</div></div>
<div class="card rate-card small auto"><div class="rate-head"><div class="rate-icon auto-icon">↻</div><div style="flex:1"><div class="label">KURS OTOMATIS ⓘ</div><div id="marketRate" class="big purple">Memuat...</div><div class="subline">per 1 USD</div></div><button id="refreshRate" class="refresh">Refresh</button></div><div id="rateMsg" class="muted"></div></div>
<div class="card rate-card small thb-card"><div class="rate-icon thb-icon"></div><div class="label">USD → THB</div><div id="thbRate" class="big orange">—</div><div class="subline">THB per 1 USD</div></div></div>
<div class="money-grid"><div class="card money-card purple"><div class="label">TOTAL MODAL (IDR)</div><div id="baseBal" class="big">Rp0</div></div><div class="card money-card blue"><div class="label">TOTAL USD</div><div id="tradeBal" class="big">$0</div></div><div class="card money-card orange"><div class="label">USD DI TANGAN</div><div id="usdHand" class="big">$0</div></div><div class="card money-card green"><div class="label">PROFIT BULAN INI</div><div id="profit" class="big">Rp0</div></div></div>
<div class="action-grid" style="margin-top:10px"><button id="buyBtn" class="action primary"><span class="ico">↗</span><span>Customer<br>Beli USD</span></button><button id="sellBtn" class="action sell"><span class="ico">↓</span><span>Customer<br>Jual USD</span></button></div>
<button id="capitalBtn" class="action capital-action"><span class="ico">＋</span><span>Tambah Modal</span></button>
<div class="share-actions"><button id="shareBuyBtn" class="action share"><span class="ico">●</span><span>Bagikan Kurs Beli</span></button><button id="shareSellBtn" class="action share"><span class="ico">●</span><span>Bagikan Kurs Jual</span></button></div>
<div class="shortcut-grid"><button id="customerHistoryBtn" class="action shortcut"><span class="ico">▤</span><span class="txt">Riwayat<br>Transaksi Customer<small>Lihat transaksi beli & jual</small></span></button><button id="capitalHistoryBtn" class="action shortcut"><span class="ico">▣</span><span class="txt">Riwayat<br>Tambah Modal<small>Lihat modal yang masuk</small></span></button><button id="profitHistoryBtn" class="action shortcut"><span class="ico">▥</span><span class="txt">Profit Bulanan<small>Riwayat bulan yang ditutup</small></span></button><button id="settingsBtn" class="action shortcut"><span class="ico">⚙</span><span class="txt">Pengaturan<small>Rate, bank & reset</small></span></button></div>
<div class="hidden"><button id="resetBtn">Reset / Tutup Bulan</button><button id="reload">Refresh</button><button id="reloadProfit">Refresh</button><div id="history"></div><div id="profitHistory"></div><div id="localRate">0</div></div></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="modalTitle">Form</h2><button id="close" class="close-btn">Tutup</button></div><div id="modalBody"></div><div id="modalMsg" class="status"></div></div></div>
<script>
const {createClient}=supabase, sb=createClient(MC_CONFIG.SUPABASE_URL,MC_CONFIG.SUPABASE_PUBLISHABLE_KEY);let user,settings,balance,market=0;
const $=x=>document.getElementById(x), idr=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0), num=n=>new Intl.NumberFormat("id-ID",{maximumFractionDigits:2}).format(Number(n)||0);
const typ=t=>({ADD_CAPITAL:"Tambah modal",INITIAL_CAPITAL:"Modal awal",CUSTOMER_BUY:"Customer beli USD",CUSTOMER_SELL:"Customer jual USD"}[t]||t);
const round=x=>Math.round(x/Number(settings.rounding_unit||100))*Number(settings.rounding_unit||100);
const formatInput=n=>{
  const s=String(n??"").replace(/[^0-9,.-]/g,"");
  if(!s)return "";
  const neg=s.startsWith("-")?"-":"", clean=s.replace(/-/g,""), parts=clean.split(",");
  const intPart=(parts[0]||"").replace(/\./g,"").replace(/^0+(?=\d)/,"")||"0";
  const grouped=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return neg+grouped+(parts.length>1?","+parts.slice(1).join("").replace(/[^0-9]/g,""):"");
};
const rawNumber=v=>{
  const s=String(v??"").trim().replace(/\s/g,"");
  if(!s)return 0;
  const normalized=s.includes(",")?s.replace(/\./g,"").replace(",","."):s.replace(/\./g,"");
  return Number(normalized)||0;
};
const bindAmountInput=id=>{
  const el=$(id); if(!el)return;
  el.addEventListener("input",()=>{const pos=el.selectionStart;const before=el.value;const raw=before.replace(/[^0-9,]/g,"");el.value=formatInput(raw);});
  el.addEventListener("blur",()=>{el.value=formatInput(el.value)});
};
async function load(){let s=await sb.from("mc_settings").select("*").single(),b=await sb.from("mc_balances").select("*").single();if(s.error||b.error)throw Error((s.error||b.error).message);settings=s.data;balance=b.data;let basis=Number(balance.trade_amount)>0?Number(balance.base_amount)/Number(balance.trade_amount):0;$("baseBal").textContent=idr(balance.base_amount);$("tradeBal").textContent="$"+num(balance.trade_amount);$("usdHand").textContent="$"+num(balance.usd_in_hand);$("profit").textContent=idr(balance.profit_month_idr);$("basis").textContent=idr(basis)+"/USD";$("localRate").textContent=num(settings.usd_local_rate);$("buyRate").textContent=basis?idr(round(basis*(1+Number(settings.buy_margin)) )):"Rp0";if(market)$("sellRate").textContent=idr(Math.floor(market*(1-Number(settings.sell_margin))/Number(settings.rounding_unit||100))*Number(settings.rounding_unit||100));}
async function hist(filter="all"){
  let {data,error}=await sb.from("mc_transactions").select("*").order("created_at",{ascending:false}).limit(50);
  const box=$("history");
  if(error){box.innerHTML=`<div class="status err">${error.message}</div>`;return;}
  let rows=data||[];
  if(filter==="customer") rows=rows.filter(x=>x.transaction_type==="CUSTOMER_BUY"||x.transaction_type==="CUSTOMER_SELL");
  if(filter==="capital") rows=rows.filter(x=>x.transaction_type==="ADD_CAPITAL"||x.transaction_type==="INITIAL_CAPITAL");
  if(!rows.length){box.innerHTML='<div class="muted">Belum ada data</div>';return;}
  box.innerHTML=rows.map(x=>{
    const rate=Number(x.customer_rate)||0;
    const shownIdr=x.transaction_type==="CUSTOMER_BUY"&&rate?Math.abs(Number(x.trade_amount)||0)*rate:Number(x.base_amount)||0;
    const usd=num(x.trade_amount);const idrValue=idr(shownIdr);const kurs=rate?idr(rate):"-";
    const time=new Date(x.created_at).toLocaleString("id-ID",{day:"numeric",month:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});
    return `<div class="history-item"><div class="history-top"><div class="history-type">${typ(x.transaction_type)}</div><div class="history-time">${time}</div></div><div class="history-details"><div class="history-detail"><div class="label">USD</div><div class="history-value">${usd}</div></div><div class="history-detail"><div class="label">IDR</div><div class="history-value">${idrValue}</div></div><div class="history-detail"><div class="label">Kurs</div><div class="history-value">${kurs}</div></div></div></div>`;
  }).join("");
}

async function profitHistory(){let {data,error}=await sb.from("mc_monthly_profit").select("*").eq("user_id",user.id).order("period_start",{ascending:false});$("profitHistory").innerHTML=error?`<tr><td colspan=3 class=err>${error.message}</td></tr>`:(data||[]).map(x=>`<tr><td>${new Date(x.period_start+"T00:00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"})}</td><td>${idr(x.profit_idr)}</td><td>${new Date(x.closed_at).toLocaleString("id-ID")}</td></tr>`).join("")||'<tr><td colspan=3 class=muted>Belum ada bulan yang ditutup</td></tr>';}

async function rates(){try{let r=await fetch("https://api.exchangerate.fun/latest?base=USD",{cache:"no-store"}),j=await r.json();market=Number(j.rates?.[settings.base_currency]);if(!market)throw Error();$("marketRate").textContent=idr(market)+"/USD";$("rateMsg").textContent="Kurs pasar otomatis";$("sellRate").textContent=idr(Math.floor(market*(1-Number(settings.sell_margin))/Number(settings.rounding_unit||100))*Number(settings.rounding_unit||100))}catch(e){$("marketRate").textContent="Gagal memuat";$("rateMsg").textContent="Kurs dapat dimasukkan manual saat transaksi";}}
function modal(t,b){$("modalTitle").textContent=t;$("modalBody").innerHTML=b;$("modalMsg").textContent="";$("modalMsg").className="status";$("modal").classList.remove("hidden")}$("close").onclick=()=>$("modal").classList.add("hidden");
$("capitalBtn").onclick=()=>{
  modal("Modal awal / tambah modal",'<div class=field><label>IDR</label><input id=a inputmode=decimal autocomplete=off></div><div class=field><label>USD</label><input id=u inputmode=decimal autocomplete=off></div><button id=go class=primary>Simpan modal</button>');
  bindAmountInput("a");bindAmountInput("u");
  $("go").onclick=async()=>{
    let {error}=await sb.rpc("mc_add_capital",{p_base_amount:rawNumber($("a").value),p_trade_amount:rawNumber($("u").value)});
    if(error){$("modalMsg").textContent=error.message;$("modalMsg").className="status err";return}
    $("modal").classList.add("hidden");await load();await hist()
  }
};
$("buyBtn").onclick=()=>{
  modal("Customer beli USD",'<p class=muted>Customer memberikan IDR, menerima USD.</p><div class=field><label>Jumlah USD</label><input id=u inputmode=decimal autocomplete=off></div><div class=field><label>Nama customer (opsional)</label><input id=n></div><button id=go class=primary>Proses</button>');
  bindAmountInput("u");
  $("go").onclick=async()=>{
    let {data,error}=await sb.rpc("mc_customer_buy",{p_trade_amount:rawNumber($("u").value),p_customer_name:$("n").value||null});
    if(error){$("modalMsg").textContent=error.message;$("modalMsg").className="status err";return}
    const buyRate = Number((data&&data.customer_rate) || (data&&data.rate) || currentBuyRate());
    $("modalMsg").textContent="Berhasil. Kurs "+idr(buyRate);$("modalMsg").className="status ok";await load();await hist()
  }
};
$("sellBtn").onclick=()=>{
  modal("Customer jual USD",'<p class=muted>Customer memberikan USD, menerima IDR.</p><div class=field><label>Jumlah USD</label><input id=u inputmode=decimal autocomplete=off></div><div class=field><label>Kurs pasar USD/IDR</label><input id=r inputmode=decimal value="'+(market?Math.round(market):"")+'"></div><div class=field><label>Nama customer (opsional)</label><input id=n></div><button id=go class=primary>Proses</button>');
  bindAmountInput("u");
  $("go").onclick=async()=>{
    let {data,error}=await sb.rpc("mc_customer_sell",{p_trade_amount:rawNumber($("u").value),p_market_rate:rawNumber($("r").value),p_customer_name:$("n").value||null});
    if(error){$("modalMsg").textContent=error.message;$("modalMsg").className="status err";return}
    $("modalMsg").textContent="Berhasil. Kurs "+idr((data&&data.customer_rate)||round(rawNumber($("r").value)*(1-Number(settings.sell_margin))));$("modalMsg").className="status ok";await load();await hist()
  }
};
$("settingsBtn").onclick=()=>{modal("Pengaturan",'<div class=field><label>Mata uang modal</label><input id=b value="'+settings.base_currency+'"></div><div class=field><label>Mata uang utama</label><input id=t value="'+settings.trade_currency+'"></div><div class=field><label>Mata uang lokal</label><input id=l value="'+settings.local_currency+'"></div><div class=field><label>Margin beli (%)</label><input id=mb value="'+Number(settings.buy_margin)*100+'"></div><div class=field><label>Margin jual (%)</label><input id=ms value="'+Number(settings.sell_margin)*100+'"></div><div class=field><label>Profit jual USD per $1 (IDR)</label><input id=ca value="'+settings.capital_add_per_unit+'"></div><div class=field><label>Pembulatan kurs</label><input id=ru value="'+settings.rounding_unit+'"></div><div class=field><label>USD → KHR</label><input id=lr value="'+settings.usd_local_rate+'"></div><hr style="border-color:#292c2a;margin:16px 0"><div class=field><label>Nama Bank</label><input id=bn value="'+(settings.bank_name||"")+'" autocomplete="organization"></div><div class=field><label>Nomor Rekening</label><input id=ba value="'+(settings.bank_account_number||"")+'" inputmode="numeric" autocomplete="off"></div><div class=field><label>Atas Nama</label><input id=ban value="'+(settings.bank_account_name||"")+'" autocomplete="name"></div><button id=go class=primary>Simpan pengaturan</button><hr style="border-color:#292c2a;margin:16px 0"><div class=field><label>Mulai dari nol</label><div class="muted">Hapus semua transaksi, profit bulanan, dan saldo. Pengaturan tetap tersimpan.</div></div><button id=resetAllBtn style="width:100%;border-color:#8b3030;background:#3a1717;color:#ffb0b0">Hapus Semua Data / Mulai Baru</button>');$("go").onclick=async()=>{let p={base_currency:$("b").value.trim().toUpperCase(),trade_currency:$("t").value.trim().toUpperCase(),local_currency:$("l").value.trim().toUpperCase(),buy_margin:Number($("mb").value)/100,sell_margin:Number($("ms").value)/100,capital_add_per_unit:Number($("ca").value),rounding_unit:Number($("ru").value),usd_local_rate:Number($("lr").value),bank_name:$("bn").value.trim(),bank_account_number:$("ba").value.trim(),bank_account_name:$("ban").value.trim(),updated_at:new Date().toISOString()};let {error}=await sb.from("mc_settings").update(p).eq("user_id",user.id);if(error){$("modalMsg").textContent=error.message;$("modalMsg").className="status err";return}$("modal").classList.add("hidden");await load();await rates()}};document.addEventListener("click",async e=>{if(e.target&&e.target.id==="resetAllBtn"){
  if(!confirm("PERINGATAN: Semua transaksi, profit bulanan, dan saldo akan dihapus. Pengaturan tetap tersimpan. Lanjutkan?"))return;
  if(!confirm("KONFIRMASI TERAKHIR: Data lama benar-benar akan dihapus. Lanjutkan?"))return;
  let {error}=await sb.rpc("mc_reset_all_data");
  if(error){$("modalMsg").textContent=error.message;$("modalMsg").className="status err";return}
  alert("Semua data berhasil dihapus. Masukkan modal baru untuk mulai nyata.");
  $("modal").classList.add("hidden");await load();await hist();await profitHistory();
}});
function shareText(title,text){
  if(navigator.share){ navigator.share({title,text}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>alert("Pesan disalin. Silakan tempel ke aplikasi pilihan Anda.")); }
  else { prompt("Salin pesan ini:",text); }
}
function currentBuyRate(){
  const basis=Number(balance?.trade_amount)>0?Number(balance.base_amount)/Number(balance.trade_amount):0;
  return basis?round(basis*(1+Number(settings.buy_margin))):0;
}
function currentSellRate(){ return market?Math.floor(market*(1-Number(settings.sell_margin))/Number(settings.rounding_unit||100))*Number(settings.rounding_unit||100):0; }
$("shareBuyBtn").onclick=()=>{
  const text=`HARGA BELI\n\nKURS/RATE: ${idr(currentBuyRate())} / USD\n\nNAMA BANK: ${settings.bank_name||"-"}\nNOMOR REKENING: ${settings.bank_account_number||"-"}\nNAMA REKENING: ${settings.bank_account_name||"-"}`;
  shareText("Harga Beli USD",text);
};
$("shareSellBtn").onclick=()=>{
  const text=`HARGA JUAL\n\nKURS/RATE: ${idr(currentSellRate())} / USD`;
  shareText("Harga Jual USD",text);
};
$("loginBtn").onclick=async()=>{let {data,error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("loginMsg").textContent=error?error.message:"Berhasil masuk";if(!error)start(data.user)};
$("signupBtn").onclick=async()=>{let {data,error}=await sb.auth.signUp({email:$("email").value,password:$("password").value});$("loginMsg").textContent=error?error.message:(data.session?"Akun dibuat":"Akun dibuat, cek email verifikasi")};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("refreshRate").onclick=rates;$("reload").onclick=hist;$("reloadProfit").onclick=profitHistory;
$("resetBtn").onclick=async()=>{if(!confirm("Tutup bulan dan reset Total IDR, Total USD, USD di Tangan, serta Profit Bulan Ini? Riwayat tetap tersimpan."))return;let {data,error}=await sb.rpc("mc_reset_month");if(error)return alert("Gagal reset: "+error.message);alert("Bulan ditutup. Profit sebelumnya: "+idr(data.previous_profit_idr));await load();await hist();await profitHistory();};
async function start(u){user=u;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");try{await load();await hist();await profitHistory();await rates();loadThbCard()}catch(e){alert("Database belum siap: "+e.message)}}
sb.auth.getSession().then(x=>{if(x.data.session)start(x.data.session.user)});function updateHeaderClock(){const d=new Date();const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];$('todayDate').textContent=d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();$('todayTime').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}updateHeaderClock();setInterval(updateHeaderClock,30000);

function openHistory(title,filter){
  modal(title,'<div id="historyModalBox" class="history-list"><div class="muted">Memuat...</div></div>');
  const old=history; // keep existing renderer untouched
  hist(filter).then(()=>{$("historyModalBox").innerHTML=$("history").innerHTML;}).catch(e=>{$("historyModalBox").innerHTML=`<div class="status err">${e.message}</div>`;});
}
$("customerHistoryBtn").onclick=()=>openHistory("Riwayat Transaksi Customer","customer");
$("capitalHistoryBtn").onclick=()=>openHistory("Riwayat Tambah Modal","capital");
$("profitHistoryBtn").onclick=()=>{
  modal("Profit Bulanan",'<div style="overflow:auto"><table><thead><tr><th>Bulan</th><th>Profit</th><th>Ditutup</th></tr></thead><tbody id="profitModalTable"><tr><td colspan="3" class="muted">Memuat...</td></tr></tbody></table></div>');
  profitHistory().then(()=>{$("profitModalTable").innerHTML=$("profitHistory").innerHTML;});
};
$("settingsBtn").onclick=(()=>$("settingsBtn").onclick)();
const _oldSettingsBtnHandler=$("settingsBtn").onclick;
$("settingsBtn").onclick=()=>{_oldSettingsBtnHandler();setTimeout(()=>{
  const body=$("modalBody"); if(!body)return;
  const sep=document.createElement("hr");sep.style.cssText="border-color:#25302b;margin:14px 0";
  const btn=document.createElement("button");btn.id="resetMonthInside";btn.className="primary";btn.style.width="100%";btn.textContent="Tutup Bulan / Reset Profit";
  body.appendChild(sep);body.appendChild(btn);
},0)};
document.addEventListener("click",async e=>{if(e.target&&e.target.id==="resetMonthInside"){
  if(!confirm("Tutup bulan dan reset Total IDR, Total USD, USD di Tangan, serta Profit Bulan Ini? Riwayat tetap tersimpan."))return;
  let {data,error}=await sb.rpc("mc_reset_month");
  if(error){$("modalMsg").textContent=error.message;$("modalMsg").className="status err";return;}
  alert("Bulan ditutup. Profit sebelumnya: "+idr(data.previous_profit_idr));
  $("modal").classList.add("hidden");await load();await hist();await profitHistory();
}});
function loadThbCard(){try{const v=Number(localStorage.getItem("mc_usd_thb_rate_"+(user?.id||"")));$("thbRate").textContent=v>0?num(v)+" THB/USD":"—";}catch(e){$("thbRate").textContent="—"}}

</script></body></html>
