header{padding:10px 14px 8px;background:rgba(5,10,14,.96);border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:5}.head{display:flex;align-items:center;gap:10px;max-width:700px;margin:auto;min-width:0}.brand-mark{font-size:31px;line-height:.75;color:#10e29a;text-shadow:0 0 16px rgba(16,226,154,.35);font-weight:900;flex:0 0 auto}h1{font-size:20px;letter-spacing:.01em;margin:0;font-weight:850;white-space:nowrap}.head-right{margin-left:auto;display:flex;align-items:center;gap:9px;min-width:0}.datebox{display:none;text-align:right;font-size:11px;color:#dce5ee}.datebox strong{display:block;font-size:16px;margin-top:3px;color:#fff}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#173b67,#10243c);border:1px solid #275487;font-size:16px;font-weight:800;flex:0 0 auto}.head button{padding:8px 12px;font-size:12px}

t:78px;padding:10px 12px}.thb-card .thb-icon{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:linear-gradient(#fff 0 20%,#e21d37 20% 37%,#173b7a 37% 63%,#e21d37 63% 80%,#fff 80%);border:2px solid #f04a58}.thb-card .big{color:var(--orange);font-size:clamp(17px,4vw,21px)}
.money-card{min-width:0;min-height:92px;padding:11px 12px}.hand-card{min-height:112px}.hand-thb{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.09)}.hand-thb span{font-size:8px;letter-spacing:.07em;color:#c7bba8;font-weight:800;white-space:nowrap}.hand-thb strong{font-size:13px;color:#ffd08a;white-space:nowrap}.money-card.purple{border-color:#7140ff;background:linear-gradient(145deg,rgba(71,21,145,.5),rgba(9,24,44,.97))}.money-card.blue{border-color:#1477ff;background:linear-gradient(145deg,rgba(9,71,159,.48),rgba(7,22,39,.97))}.money-card.orange{border-color:#db841e;background:linear-gradient(145deg,rgba(125,71,9,.5),rgba(31,24,12,.97))}.money-card.green{border-color:#10b979;background:linear-gradient(145deg,rgba(0,100,69,.5),rgba(7,27,23,.97))}.money-card .big{font-size:clamp(17px,4vw,21px);letter-spacing:-.02em;text-overflow:clip}

button,input{font:inherit}button{padding:9px 11px;border-radius:10px;border:1px solid #33413a;background:#17201c;color:#fff;font-weight:750;cursor:pointer}button.primary{background:#0a8e59;border-color:#0dbd75}button:active{transform:scale(.98)}input{width:100%;padding:11px;border-radius:10px;border:1px solid #33413a;background:#090e0c;color:#fff}.field{margin:10px 0}.field label{display:block;color:#b8c2bd;font-size:12px;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}.status{padding:9px;margin:9px 0;border-radius:10px;background:#0d1411;color:#aeb9b3;font-size:12px}.err{color:#ff9090}.ok{color:#55d99b}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #25302b}th{color:#89958f;font-weight:600}.history-list{display:flex;flex-direction:column}.history-item{padding:11px 0;border-bottom:1px solid #25302b}.history-item:last-child{border-bottom:0}.history-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.history-type{font-weight:750}.history-time{color:#78857f;font-size:10px;white-space:nowrap}.history-details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:7px}.history-detail .label{font-size:8px}.history-value{font-weight:750;margin-top:3px;overflow-wrap:anywhere}.hidden{display:none!important}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end;backdrop-filter:blur(5px)}.modalbox{width:min(620px,100%);max-height:88vh;overflow:auto;background:linear-gradient(145deg,#121a17,#090e0c);border:1px solid #2a3831;border-radius:20px 20px 0 0;padding:15px;box-shadow:0 -12px 40px rgba(0,0,0,.5)}.modalbox .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.modalbox .row>*{flex:initial}.modalbox h2{font-size:17px}.close-btn{padding:7px 10px;font-size:11px}.login-card{margin-top:35px}.login-card h2{font-size:20px;margin-bottom:12px}.login-card .actions button{min-width:0}
@media(max-width:390px){.hand-card{min-height:108px}.hand-thb strong{font-size:12px}main{padding-left:9px;padding-right:9px}.brand-mark{font-size:29px}h1{font-size:19px}.rate-card.rate-buy,.rate-card.rate-sell{grid-template-columns:42px minmax(0,1fr);column-gap:8px;min-height:102px;padding:10px}.rate-card.rate-buy .rate-icon,.rate-card.rate-sell .rate-icon{width:42px;height:42px;font-size:23px}.rate-card .big{font-size:18px}.rate-card.small .big{font-size:16px}.rate-head .big{font-size:15px}.money-card .big{font-size:16px}.action{font-size:13px}.action .ico{width:38px;height:38px;flex-basis:38px;font-size:21px}.shortcut{font-size:11px}.shortcut .ico{width:38px;height:38px;font-size:18px}.shortcut .txt small{font-size:7px}}


/* Final compact mobile layout: icons never consume the number column. */
.rate-card,.money-card,.action,.shortcut{min-width:0;overflow:hidden}
.money-card .label{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money-card .big{font-size:clamp(17px,4vw,21px);white-space:nowrap;overflow:hidden;text-overflow:clip}
.action-grid,.share-actions,.shortcut-grid{gap:8px}
.action{min-height:58px;padding:8px 9px;gap:7px}
.action .ico{width:34px;height:34px;flex-basis:34px;font-size:19px}
.capital-action{min-height:58px}
.shortcut{min-height:104px;padding:9px}
.shortcut .ico{width:36px;height:36px;font-size:18px}
.shortcut .txt{font-size:11px}
.shortcut .txt small{font-size:8px}
@media(max-width:390px){
  .rate-card.rate-buy,.rate-card.rate-sell{grid-template-columns:31px minmax(0,1fr);column-gap:7px;min-height:94px;padding:9px 8px 9px 10px}

  .rate-head{grid-template-columns:31px minmax(0,1fr) auto;gap:6px}
  .rate-head .rate-icon{width:31px;height:31px;flex-basis:31px;font-size:18px}
  .rate-head .refresh{min-width:47px;padding:6px 5px!important;font-size:8px!important}
  .rate-head .subline{font-size:8px}

  .thb-card{min-height:72px!important;padding:9px 10px}
  .thb-card .thb-icon{width:34px;height:34px;flex-basis:34px}
  .thb-card .big{font-size:18px}
  .money-card{min-height:86px;padding:10px}
  .money-card .big{font-size:17px}
  .action{min-height:54px;font-size:12px}
  .action .ico{width:31px;height:31px;flex-basis:31px;font-size:18px}
  .capital-action{min-height:56px}
  .shortcut{min-height:96px}
}

/* FINAL RATE CARD FIX */
.auto-refresh-card{appearance:none;-webkit-appearance:none;width:100%;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;border-radius:16px!important;padding:10px!important;}
.auto-refresh-card:active{transform:scale(.995)}
.auto-refresh-card .rate-head{grid-template-columns:34px minmax(0,1fr);gap:8px;}
.auto-refresh-card .rate-content{min-width:0;}
.auto-refresh-card .label{font-size:9px!important;white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important;}
.auto-refresh-card .big{font-size:clamp(17px,3.7vw,21px)!important;line-height:1.05!important;overflow:visible!important;text-overflow:clip!important;white-space:nowrap!important;}
.auto-refresh-card .subline{font-size:10px!important;white-space:nowrap!important;}
.auto-refresh-card .muted{font-size:9px!important;white-space:nowrap!important;overflow:hidden;text-overflow:ellipsis;}
.thb-card{gap:9px!important;}
.thb-card .rate-content{flex:1;min-width:0;}
.thb-delete{flex:0 0 auto!important;padding:6px 8px!important;font-size:9px!important;border-radius:8px!important;background:#38161b!important;border-color:#a73342!important;color:#ff9eaa!important;}
.thb-delete:disabled{opacity:.35;cursor:not-allowed;}
@media(max-width:390px){
 .auto-refresh-card{padding:9px!important;}
 .auto-refresh-card .rate-head{grid-template-columns:31px minmax(0,1fr);gap:6px;}
 .auto-refresh-card .rate-head .rate-icon{width:31px;height:31px;flex-basis:31px;font-size:18px;}
 .auto-refresh-card .label{font-size:8px!important;}
 .auto-refresh-card .big{font-size:16px!important;}
 .auto-refresh-card .subline{font-size:9px!important;}
 .auto-refresh-card .muted{font-size:8px!important;}
 .thb-delete{padding:5px 7px!important;font-size:8px!important;}
}

/* FINAL HISTORY + SHARE DISPLAY FIX — visual only */
.history-list{gap:0;width:100%;min-width:0}
.history-item{padding:13px 0;border-bottom:1px solid #25302b;min-width:0}
.history-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-width:0}
.history-type{font-weight:800;min-width:0;overflow-wrap:anywhere}
.history-name{display:block;color:#dce6e1;font-size:12px;font-weight:700;margin-top:3px;overflow-wrap:anywhere}
.history-time{color:#78857f;font-size:10px;white-space:nowrap;flex:0 0 auto}
.history-details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px;min-width:0}
.history-detail{min-width:0}
.history-detail .label{font-size:8px;color:#89958f;letter-spacing:.06em;text-transform:uppercase}
.history-value{font-weight:800;margin-top:3px;line-height:1.2;overflow-wrap:anywhere;word-break:break-word;font-size:12px}

.history-capital .history-detail:last-child{display:none}
@media(max-width:480px){
  .history-item{padding:12px 0}
  .history-top{gap:8px}
  .history-type{font-size:13px}
  .history-name{font-size:11px}
  .history-time{font-size:9px}
  .history-details{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}

}
</style>

<body>
<header><div class="head"><div class="brand-mark">↔</div><h1>MONEY CHANGER</h1><div class="head-right"><div class="datebox"><span id="todayDate">18 Sep 2026</span><strong id="todayTime">22:11</strong></div><div class="avatar">HN</div><button id="logout" class="hidden">Keluar</button></div></div></header>
<main>
<section id="login" class="panel login-card"><h2>Masuk</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button id="loginBtn" class="primary">Masuk</button><button id="signupBtn">Buat akun</button></div><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden"><div class="rate-grid">
<div class="card rate-card rate-buy"><div class="rate-icon">↗</div><div class="rate-content"><div class="label">KURS BELI USD</div><div id="buyRate" class="big green">Rp0</div><div class="subline">dari customer</div></div></div>
<div class="card rate-card rate-sell"><div class="rate-icon">↓</div><div class="rate-content"><div class="label">KURS JUAL USD</div><div id="sellRate" class="big red">Rp0</div><div class="subline">ke customer</div></div></div>
<div class="card rate-card small"><div class="rate-icon base-icon">↻</div><div class="rate-content"><div class="label">KURS DASAR</div><div id="basis" class="big blue">Rp0</div><div class="subline">per 1 USD</div></div></div>
<button id="refreshRate" class="card rate-card small auto auto-refresh-card" type="button" aria-label="Refresh kurs otomatis"><div class="rate-head"><div class="rate-icon auto-icon">↻</div><div class="rate-content"><div class="label">KURS OTOMATIS</div><div id="marketRate" class="big purple">Memuat...</div><div class="subline">per 1 USD</div><div id="rateMsg" class="muted">Tap kartu untuk refresh</div></div></div></button>
<div class="card rate-card small thb-card"><div class="rate-icon thb-icon"></div><div class="rate-content"><div class="label">USD → THB</div><div id="thbRate" class="big orange">—</div><div class="subline">THB per 1 USD</div></div><button id="deleteThbBtn" class="thb-delete" type="button" title="Hapus input USD → THB terakhir">Hapus</button></div></div>
<div class="money-grid"><div class="card money-card purple"><div class="label">TOTAL MODAL (IDR)</div><div id="baseBal" class="big">Rp0</div></div><div class="card money-card blue"><div class="label">TOTAL USD</div><div id="tradeBal" class="big">$0</div></div><div class="card money-card orange hand-card"><div class="label">USD DI TANGAN</div><div id="usdHand" class="big">$0</div><div class="hand-thb"><span>THB DI TANGAN</span><strong id="thbHand">0 THB</strong></div></div><div class="card money-card green"><div class="label">PROFIT BULAN INI</div><div id="profit" class="big">Rp0</div></div></div>
<div class="action-grid" style="margin-top:10px"><button id="buyBtn" class="action primary"><span class="ico">↗</span><span>Customer<br>Beli USD</span></button><button id="sellBtn" class="action sell"><span class="ico">↓</span><span>Customer<br>Jual USD</span></button></div>
<button id="capitalBtn" class="action capital-action"><span class="ico">＋</span><span>Tambah Modal</span></button>
<div class="share-actions"><button id="shareBuyBtn" class="action share"><span class="ico">●</span><span>Bagikan Kurs Beli</span></button><button id="shareSellBtn" class="action share"><span class="ico">●</span><span>Bagikan Kurs Jual</span></button></div>
<div class="shortcut-grid"><button id="customerHistoryBtn" class="action shortcut"><span class="ico">▤</span><span class="txt">Riwayat<br>Transaksi Customer<small>Lihat transaksi beli & jual</small></span></button><button id="capitalHistoryBtn" class="action shortcut"><span class="ico">▣</span><span class="txt">Riwayat<br>Tambah Modal<small>Lihat modal yang masuk</small></span></button><button id="profitHistoryBtn" class="action shortcut"><span class="ico">▥</span><span class="txt">Profit Bulanan<small>Riwayat bulan yang ditutup</small></span></button><button id="settingsBtn" class="action shortcut"><span class="ico">⚙</span><span class="txt">Pengaturan<small>Rate, bank & reset</small></span></button></div>
<div class="hidden"><button id="resetBtn">Reset / Tutup Bulan</button><button id="reload">Refresh</button><button id="reloadProfit">Refresh</button><div id="history"></div><div id="profitHistory"></div><div id="localRate">0</div></div></section></main>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="modalTitle">Form</h2><button id="close" class="close-btn">Tutup</button></div><div id="modalBody"></div><div id="modalMsg" class="status"></div></div></div>
<script>
const {createClient}=supabase, sb=createClient(MC_CONFIG.SUPABASE_URL,MC_CONFIG.SUPABASE_PUBLISHABLE_KEY);let user,settings,balance,market=0;
let thbRate=0;
function thbStorageKey(){return user ? "mc_usd_thb_entries_"+user.id : "mc_usd_thb_entries"}
function readThbEntries(){
  const key=thbStorageKey();
  let d={entries:[]};
  try{d=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  if(!Array.isArray(d.entries)){
    // Migrate the previous THB-only storage without touching Supabase balances.
    let old={};

function parseGoogleIdr(text){
  const m=String(text||"").match(/Dolar Amerika Serikat\s*\/\s*Rupiah Indonesia[\s\S]{0,220}?([0-9]{1,3}(?:\.[0-9]{3})*(?:,[0-9]+)?)/i);
  if(!m)return 0;
  const v=m[1].replace(/\./g,"").replace(",",".");
  return Number(v)||0;
}
async function googleFinanceRate(){
  const target="https://www.google.com/finance/quote/USD-IDR?hl=id";
  const urls=[
    target,
    "https://r.jina.ai/http://www.google.com/finance/quote/USD-IDR?hl=id"
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{cache:"no-store",headers:{"Accept":"text/html,text/plain,*/*"}});
      if(!r.ok)continue;
      const text=await r.text();
      const value=parseGoogleIdr(text);
      if(value>10000&&value<30000)return value;
    }catch(e){}
  }
  return 0;
}
async function rates(){

sb.auth.getSession().then(x=>{if(x.data.session)start(x.data.session.user)});function updateHeaderClock(){const d=new Date();const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];$('todayDate').textContent=d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();$('todayTime').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}updateHeaderClock();setInterval(updateHeaderClock,30000);

function openHistory(title,filter){
  modal(title,'<div id="historyModalBox" class="history-list"><div class="muted">Memuat...</div></div>');
  const old=history; // keep existing renderer untouched
  hist(filter).then(()=>{$("historyModalBox").innerHTML=$("history").innerHTML;}).catch(e=>{$("historyModalBox").innerHTML=`<div class="status err">${e.message}</div>`;});
}
$("customerHistoryBtn").onclick=()=>openHistory("Riwayat Transaksi Customer","customer");
$("capitalHistoryBtn").onclick=()=>openHistory("Riwayat Tambah Modal","capital");
$("profitHistoryBtn").onclick=()=>{
  modal("Profit Bulanan",'<div style="overflow:auto"><table><thead><tr><th>Bulan</th><th>Profit</th><th>Ditutup</th></tr></thead><tbody id="profitModalTable"><tr><td colspan="3" class="muted">Memuat...</td></tr></tbody></table></div>');
  profitHistory().then(()=>{$("profitModalTable").innerHTML=$("profitHistory").innerHTML;});
};
$("settingsBtn").onclick=(()=>$("settingsBtn").onclick)();
const _oldSettingsBtnHandler=$("settingsBtn").onclick;
$("settingsBtn").onclick=()=>{_oldSettingsBtnHandler();setTimeout(()=>{
  const body=$("modalBody"); if(!body)return;
  const sep=document.createElement("hr");sep.style.cssText="border-color:#25302b;margin:14px 0";
  const btn=document.createElement("button");btn.id="resetMonthInside";btn.className="primary";btn.style.width="100%";btn.textContent="Tutup Bulan / Reset Profit";
  body.appendChild(sep);body.appendChild(btn);
},0)};
document.addEventListener("click",async e=>{if(e.target&&e.target.id==="resetMonthInside"){
  if(!confirm("Tutup bulan dan reset Total IDR, Total USD, USD di Tangan, serta Profit Bulan Ini? Riwayat tetap tersimpan."))return;
  let {data,error}=await sb.rpc("mc_reset_month");
  if(error){$("modalMsg").textContent=error.message;$("modalMsg").className="status err";return;}
  alert("Bulan ditutup. Profit sebelumnya: "+idr(data.previous_profit_idr));
  $("modal").classList.add("hidden");await load();await hist();await profitHistory();
}});
</script></body></html>
